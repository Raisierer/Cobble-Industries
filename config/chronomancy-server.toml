#Time Rift: tears in stopped time that can open when The World Stop is cast
[time_rift]
	#Time Rift switch: 0 disables the trial entirely; any value above 0 enables it.
	#Rifts open on every World Stop cast by a player wearing the Rift Heart, and never without it.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	chance = 0.1
	#Trial waves: wave N opens N rifts (wave 1 - one rift, wave 2 - two, ...)
	# Default: 3
	# Range: 1 ~ 6
	waves = 3
	#Ticks between two Chronomaly releases of one rift
	# Default: 40
	# Range: 5 ~ 400
	spawnIntervalTicks = 40

#Rift trial: time stays stopped until the caster defeats the Chronomalies or dies
[rift_trial]
	#Minimum number of mobs one rift releases
	# Default: 3
	# Range: 1 ~ 32
	minMobsPerRift = 3
	#Maximum number of mobs one rift releases
	# Default: 7
	# Range: 1 ~ 32
	maxMobsPerRift = 7
	#Share of phasing zombies/skeletons/creepers among released mobs (the rest are Chronomalies)
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	phasingMobShare = 0.6
	#How many trial mobs may be alive at the same time
	# Default: 8
	# Range: 1 ~ 32
	maxAlive = 8
	#Safety limit in seconds: the trial ends and time resumes after this long (0 = never)
	# Default: 300
	# Range: 0 ~ 3600
	timeoutSeconds = 300
	#After the Chronomaly wave the Rift Maker boss appears; time stays stopped until it falls
	spawnBoss = true
	#Islands of time: every this many seconds a new island opens and the previous one closes
	#(the first one opens this long after the trial began; 0 = no islands).
	#Inside an island the caster's own time flows again: natural health regeneration, hunger and mana regeneration
	# Default: 30
	# Range: 0 ~ 3600
	islandPeriodSeconds = 30
	#Islands of time: radius in blocks
	# Default: 3.0
	# Range: 1.0 ~ 16.0
	islandRadius = 3.0

#Time Paradox: an Accelerated Zone and a Time Dilation Field meeting at one point
[paradox]
	#Blast damage = (field slow % + zone haste %) x this multiplier. 40% + 40% = 80 damage at 1.0
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	damageMultiplier = 1.0
	#Paradox effect duration in seconds per point of blast damage (0.25 = damage / 4: 80 damage -> 20 s)
	# Default: 0.25
	# Range: 0.0 ~ 5.0
	effectSecondsPerDamage = 0.25

#Accelerated Zone
[accelerated_zone]
	#Haste at level 1 (0.40 = enemies are 40% faster)
	# Default: 0.4
	# Range: 0.0 ~ 0.85
	baseHaste = 0.4
	#Extra haste per spell level
	# Default: 0.05
	# Range: 0.0 ~ 0.5
	hastePerLevel = 0.05
	#How much of the haste becomes extra damage taken (1.0 = +40% damage at +40% haste)
	# Default: 1.0
	# Range: 0.0 ~ 5.0
	damageTakenShare = 1.0
	#Damage an enemy takes when it enters or leaves the zone, as a share of the haste percentage
	#(0.15 at 40% haste = 6 damage; on the way out the zone's extra-damage debuff still applies)
	# Default: 0.15
	# Range: 0.0 ~ 5.0
	crossingDamageShare = 0.15
	#Ticks before the same enemy can be hurt by crossing a zone border again
	# Default: 20
	# Range: 0 ~ 1200
	crossingCooldownTicks = 20

#Sands of Time
[sands_of_time]
	#Starting damage per second at level 1 (before spell power)
	# Default: 8.0
	# Range: 0.0 ~ 1000.0
	baseDamage = 8.0
	#Extra starting damage per second for every level above 1
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	damagePerLevel = 2.0
	#Stasis at the end of a full channel, in ticks
	# Default: 40
	# Range: 0 ~ 1200
	stasisTicks = 40

#Temporal Stasis
[stasis]
	#Every new stasis on the same target is this much shorter than the previous one
	#(0.2: 100%, 80%, 60%, 40%, 20%, then immune until the counter resets). 0 disables it
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	fatiguePerStasis = 0.2
	#Seconds without a new stasis after which the counter resets
	# Default: 60
	# Range: 1 ~ 3600
	fatigueResetSeconds = 60
	#The same step for a stasis caused by the Rift Maker itself (its slam and its Sands of Time):
	#0.1 = its stasis on one player goes 100%, 90%, 80% ... instead of 100%, 80%, 60%
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	riftMakerFatiguePerStasis = 0.1

#Time-Piercing Needle
[needles]
	#Stacks one needle adds to a target under Paradox or inside an Accelerated Zone (1 = no bonus)
	# Default: 2
	# Range: 1 ~ 12
	stacksPerHitWhenUnstable = 2
	#Collapse damage of a single needle (before spell power). The same for players and mobs
	# Default: 7.5
	# Range: 0.0 ~ 1000.0
	firstNeedleDamage = 7.5
	#Every further needle multiplies the collapse damage by this much
	#(7.5 and 1.45: 1 needle = 7.5, 4 = 22.9, 8 = 101, 12 = 447; originally 0.4, 3.2, 51 and 819)
	# Default: 1.45
	# Range: 1.0 ~ 4.0
	growthPerStack = 1.45

#Borrowed Future
[borrowed_future]
	#Extra damage taken while hastened, as a share of the haste (0.1: x2.75 haste -> +27.5% damage)
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	damageTakenPerHaste = 0.1
	#Share of a foreign Temporal Stasis duration and of any time slow that still reaches a player
	#under Borrowed Future, in both phases (0.5 = twice weaker, 1.0 = no protection)
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	stasisAndSlowShare = 0.5

#Trinkets
[items]
	#Deferred Pendulum: share of incoming damage that is postponed
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	pendulumDeferredShare = 0.5
	#Deferred Pendulum: how long the postponed damage waits, in ticks
	# Default: 100
	# Range: 1 ~ 1200
	pendulumDelayTicks = 100
	#Deferred Pendulum: share of the postponed damage that never arrives (0.2 = it lands a fifth weaker)
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	pendulumLostShare = 0.2
	#Second Chance Watch: cooldown in seconds
	# Default: 180
	# Range: 1 ~ 36000
	watchCooldownSeconds = 180
	#Second Chance Watch: how far back it rewinds, in ticks (history keeps about 6 seconds)
	# Default: 100
	# Range: 1 ~ 115
	watchRewindTicks = 100
	#Cracked Dial: chance that a melee hit puts the target into stasis
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	crackedDialChance = 0.1

#Clocksmith
[clocksmith]
	#Multiplier for every Clocksmith price except the Ring of Rifts. Applies to offers generated after the change
	# Default: 2.0
	# Range: 0.1 ~ 20.0
	priceMultiplier = 2.0
