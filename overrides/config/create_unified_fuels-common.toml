#Known fluids are built-in fluid entries CUF understands.
#Usually edit enabled, fuel_enabled or multiplier. Keep fluid_id unchanged unless you are deliberately remapping a known entry.
[known_fluids]

		[known_fluids.create_diesel_generators.diesel]
			#Fluid registry id. Change this only when deliberately remapping a known CUF entry.
			fluid_id = "createdieselgenerators:diesel"
			#Include this known fluid in CUF tags and generated datapack entries.
			enabled = true
			#Fuel group used for shared compatibility and balance.
			group = "diesel"
			#Treat this specific fluid as burnable fuel.
			#Non-fuel source fluids also require allow_non_original_fuel=true.
			fuel_enabled = true
			#Safety confirmation for fluids that are not fuel in their source mods.
			#Leave this false unless you intentionally want this process fluid to burn.
			allow_non_original_fuel = false
			#Per-fluid multiplier applied after the fuel group's burn_time and efficiency_multiplier.
			# Default: 1.0
			# Range: 0.0 ~ 100.0
			multiplier = 1.0

		[known_fluids.create_diesel_generators.biodiesel]
