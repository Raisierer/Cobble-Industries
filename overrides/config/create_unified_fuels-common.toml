[core_settings]
	#Master switch for Create: Unified Fuels compatibility behavior.
	#Turn this off to disable generated fuel compatibility and runtime adapters.
	enable_compatibility = true
	#Log a warning when a config entry turns a non-fuel process fluid into fuel.
	warn_non_original_fuel_overrides = true
	#Export tags, recipes and addon data from the resolved config as an always-active live datapack.
	#Disable this only if you want CUF to provide runtime adapters without generated datapack content.
	enable_live_datapack_export = true
	#Allow fluids that are present in a consumer fuel tag but are not listed in known_fluids.
	#Set this to false if you want every non-vanilla unified fuel to be explicitly listed in this config.
	allow_unknown_tagged_fluids = true
	#Log a short startup summary with prepared fuel groups.
	log_startup_summary = true

#Enable or disable each supported fuel consumer integration.
#Optional addons are ignored when they are not installed.
[supported_addons]
	#Enable integration for Create: Diesel Generators.
	create_diesel_generators = true
	#Enable integration for Create: The Factory Must Grow / TFMG Community Edition.
	tfmg = true
	#Enable integration for Create Crafts & Additions.
	create_crafts_and_additions_burner = true
	#Enable integration for Create: Liquid Fuel.
	create_liquid_fuel = true
	#Enable integration for Create: Steam 'n' Rails.
	steam_n_rails_trains = true
	#Enable integration for Create Stuff 'N Additions.
	create_stuff_and_additions_tank = true
	#Enable integration for Create: Petrochem.
	petrochem_diesel_engine = true
	#Enable integration for Create: Petrochem.
	petrochem_gasoline_engine = true
	#Enable integration for Create: Petrochem.
	petrochem_turbine = true

#Shared fuel balance by group.
#burn_time is ticks per 1000 mB bucket before efficiency_multiplier and per-fluid multipliers.
#Process fluids stay blocked unless fuel_enabled=true and allow_non_original_fuel=true.
[fuel_balance]

	[fuel_balance.diesel]
		#Include this fuel group in CUF tags and generated datapack entries.
		enabled = true
		#Treat this group as burnable fuel.
		#Process-fluid groups also require allow_non_original_fuel=true.
		fuel_enabled = true
		#Safety confirmation for groups that are not fuel in their source mods.
		#Leave this false unless you intentionally want a process fluid to burn.
		allow_non_original_fuel = false
		#Burn duration for 1000 mB before multipliers.
		#20 ticks = 1 second.
		#[in ticks]
		# Default: 28000
		# Range: 0 ~ 1000000
		burn_time = 28000
		#Multiplier applied to burn_time for this whole fuel group.
		# Default: 1.0
		# Range: 0.0 ~ 100.0
		efficiency_multiplier = 1.0
		#Heat output used by integrations that support regular/superheated fuels.
		#Allowed Values: NONE, REGULAR, SUPERHEATED
		heat_tier = "REGULAR"

