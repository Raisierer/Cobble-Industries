[Expedition_Settings]
	#Whether the Science Lab scientist will automatically depart on an expedition once per in-game day (morning) to the selected site.
	enableDailyAutoExpedition = true
	#Amount of durability damage dealt to the scientist's shovel and pickaxe upon returning from an expedition.
	# Default: 5
	# Range: 0 ~ 500
	toolDamagePerExpedition = 5
	#Amount of durability damage dealt to tools (brush or pickaxe) when analyzing blocks at the lab table.
	# Default: 1
	# Range: 0 ~ 100
	toolDamagePerDig = 1
	#If true, any shovel and pickaxe (wood, stone, iron, diamond, netherite, modded) can be used for expeditions instead of strictly diamond/iron.
	allowAllTools = true
	#If true, the tool tiers a Scientist can use scale with the Science Lab building level (1-5):
	#  Level 1: Wood & Stone tools (Wooden/Stone Shovel and Pickaxe)
	#  Level 2: Iron tools (+ Wood & Stone)
	#  Level 3: Gold tools (+ below)
	#  Level 4: Diamond tools (+ below)
	#  Level 5: Netherite tools (+ all tools)
	enableBuildingToolRestrictions = true

